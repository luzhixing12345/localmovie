<header>
    <a class="back" href="{back_url}">← 返回目录</a>
    <h1>{title}</h1>
</header>
<main class="player">
    <video controls preload="metadata" playsinline src="{video_url}">
        {tracks}
    </video>
    <div class="player-actions">
        <button class="favorite-toggle{favorite_class}" type="button"
                data-root="{root_index}" data-path="{relative}"
                aria-label="{favorite_label}" aria-pressed="{favorite_pressed}"
                title="{favorite_label}">
            <span class="favorite-icon" aria-hidden="true">{favorite_icon}</span>
            <span class="favorite-label">{favorite_label}</span>
        </button>
    </div>
</main>
